<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' pet-asset:; connect-src 'self' ws:; base-uri 'none'; form-action 'none'"
    />
    <title>Ember</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; -webkit-user-select: none; }
      canvas { display: block; width: 100%; height: 100%; transform-origin: 50% 100%; cursor: grab; }
      /* Дыхание — анимация на видеокарте: холст не перерисовывается. */
      @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(0.994, 1.012); } }
      canvas.breathing { animation: breathe 3.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { canvas.breathing { animation: none; } }
      canvas.dragging { cursor: grabbing; }
    </style>
  </head>
  <body>
    <canvas id="pet"></canvas>
    <script type="module" src="./pet/main.ts"></script>
  </body>
</html>
